<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tactika">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16220f">
<title>Tactika — V5.09</title>
<link rel="preload" as="image" href="assets/village.webp">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/lilita-one-latin-400-normal.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/nunito-latin-800-normal.woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<canvas id="cv"></canvas>
<div id="top"><div id="title"></div><div id="tl"></div><button class="btn dark son son-m" data-act="son-m">♪</button><button class="btn dark son son-s" data-act="son-s">🔊</button><button id="flee" class="btn dark">Fuir</button><button id="tmenu" class="btn dark" aria-label="Menu">☰</button></div>
<div id="panel">
  <div id="who"></div>
  <div id="pts"></div>
  <div id="row"><div id="spells" style="display:flex;gap:7px;flex:1;min-width:0"></div><button id="end" class="btn">Fin du tour</button></div>
  <div id="exc" role="status"></div>
  <div id="hint"></div>
</div>
<div id="camp" class="ov"></div>
<div id="map" class="ov"><div id="mapbar"><button class="btn dark" data-act="camp">⛺ Camp</button><span id="mapinfo"></span><button class="btn dark son-m" data-act="son-m">♪</button></div>
 <div id="maptabs" role="group" aria-label="Choix de la carte"></div>
 <div id="mapbox"><img id="worldimg" src="assets/world1-l.webp" alt="" onload="this.parentNode.classList.add('hasimg')" onerror="this.remove()"><svg class="isle" viewBox="0 0 100 150" preserveAspectRatio="none"><path d="M50 8 C72 6 92 24 90 52 C96 78 90 112 72 136 C58 148 40 146 26 136 C8 118 4 86 10 60 C6 34 26 10 50 8Z" fill="#7cb85a" stroke="#e8d59a" stroke-width="2.5"/><path d="M12 58 C8 80 12 104 30 110 C44 100 40 72 34 58 C28 50 18 50 12 58Z" fill="#2f5a34"/><path d="M90 52 C96 80 90 104 76 116 C66 100 68 70 76 54 C82 48 88 48 90 52Z" fill="#e3c98a"/><path d="M20 22 C30 10 46 16 44 32 C40 44 24 46 18 38 C14 32 16 26 20 22Z" fill="#8d8f8c"/><path d="M46 8 C58 4 68 10 64 22 C58 28 48 26 46 18Z" fill="#4a3a5c"/></svg><div id="mapz"></div></div>
 <div id="zsheet"></div></div>
<div id="result" class="ov"></div>
<div id="forge" class="ov"></div><div id="armes" class="ov"></div><div id="shop" class="ov"></div><div id="tav" class="ov"></div><div id="tuto"></div><dialog id="sv"></dialog>
<div id="goal" role="status"></div>
<button id="unzoom" class="btn dark">⤢ Vue entière</button>
<div id="load">Chargement…</div>
<script>
/* V5.01 : erreurs JavaScript jamais silencieuses : les 10 dernières sont gardées (localStorage « landeErr »), un bandeau discret s'affiche (max 3 par session) */
(function(){var last=0,n=0;function rec(m){try{var a=JSON.parse(localStorage.getItem('landeErr')||'[]');a.push({t:new Date().toISOString().slice(0,19),m:String(m).slice(0,300),v:'5.07'});localStorage.setItem('landeErr',JSON.stringify(a.slice(-10)))}catch(e){}
 var now=Date.now();if(now-last<30000||n>=3)return;last=now;n++;try{var d=document.createElement('div');d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99998;background:#5b2a12;color:#fff;font:700 13px system-ui,sans-serif;padding:8px 12px;border-radius:10px;text-align:center;opacity:.95';d.textContent='⚠ Une erreur est survenue, ta partie est sauvegardée. Si le jeu se fige, recharge la page. / An error occurred, your game is saved. If the game freezes, reload the page.\n('+String(m).slice(0,160)+')';d.style.whiteSpace='pre-line';d.onclick=function(){d.remove()};(document.body||document.documentElement).appendChild(d);setTimeout(function(){d.remove()},9000)}catch(e){}}
addEventListener('error',function(e){rec((e.message||'erreur')+' @'+String(e.filename||'').split('/').pop()+':'+e.lineno)});
addEventListener('unhandledrejection',function(e){rec('promesse : '+(e.reason&&e.reason.message||e.reason))});
/* V5.01 : hors connexion (service worker, voir sw.js) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
