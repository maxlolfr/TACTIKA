 {id:'mont',n:'Monts gris',x:34,y:27,th:[4],lvl:10,pool:['golem','gull','wolf','crab'],boss:{k:'golem',n:'Golem ancien',hp:2.6,dmg:1.4,h:1.5}},

 {ic:0,n:'Épée courte',who:0,dmg:2},{ic:1,n:'Hache de guerre',who:0,dmg:3},{ic:4,n:'Bouclier rond',who:0,hp:8},{ic:5,n:'Heaume',who:0,hp:6},

 {ic:3,n:'Bâton de saule',who:2,heal:3},{ic:8,n:'Anneau de rubis',who:2,dmg:2},{ic:9,n:'Amulette',who:2,hp:6}];

const THEMES=[
 {n:'Prairie',g:[0,0,0,1,1,2],obs:[0,0,2,3,4,6],water:1},
 {n:'Bois sombre',g:[6,6,6,0,1],obs:[1,1,1,0,2,6,4],water:0},
 {n:'Village',g:[5,5,7,0,0],obs:[8,8,2,3,0,9],water:0},
 {n:'Plage',g:[3,3,3,3,2],obs:[3,4,2,8],water:3},
 {n:'Monts gris',g:[9,9,10,10,9],obs:[20,20,21,4,3,19],rock:4,noflower:1,out:[20,21,19,20,4]},
 {n:'Château en ruine',g:[12,12,13,11,15,14],obs:[12,13,14,15,16,17,18,22],noflower:1,out:[12,13,22,16,14]}];

const DECO_W=[1.2,1.1,.9,.55,1.1,.8,.75,1,1,1.1,2.2,.7, .62,.62,.6,.7,.9,.85,.8,.5,1,1.1,.62,.95];
const DEC=d=>d<12?['deco',d]:['deco2',d-12],TIL=t=>t<8?['tiles',t]:['tiles2',t-8];

const R=16, CMAX=5;

// ---------- utilitaires ----------
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const K=(x,y)=>x+','+y;
const man=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let rng=Math.random;
const ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
const pick=a=>a[Math.floor(rng()*a.length)];
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let AT,IMG={};
function drawF(c,s,i,x,y,sc,flip,alpha){const f=AT[s][i];c.save();c.globalAlpha=alpha??1;c.translate(x,y);if(flip)c.scale(-1,1);
 c.drawImage(IMG[s],f[0],f[1],f[2],f[3],-f[4]*sc,-f[5]*sc,f[2]*sc,f[3]*sc);c.restore()}
function icon(s,i,px,top){const cv=document.createElement('canvas'),d=2;cv.width=cv.height=px*d;const c=cv.getContext('2d'),f=AT[s][i];
 const sh=top?f[3]*top:f[3];const k=Math.min(px*d/f[2],px*d/sh);c.drawImage(IMG[s],f[0],f[1],f[2],sh,(px*d-f[2]*k)/2,(px*d-sh*k)/2,f[2]*k,sh*k);return cv}

// ---------- audio ----------
// Fichiers ElevenLabs dans assets/audio/<nom>.mp3 ; s'ils manquent, son synthétisé de secours.
const SNDS=['slash','smash','guard','bow','arrowhit','heal','poison','buff','hit','bite','slime','death','step','click','turn','coin','levelup','victory','defeat'],MUSICS=['camp','battle','boss'];
const AU={c:null,buf:{},m:null,s:null,cur:null,src:null,on:{m:1,s:1}};
try{Object.assign(AU.on,JSON.parse(localStorage.getItem('landeSon')||'{}'))}catch(e){}
function auInit(){if(AU.c){if(AU.c.state!=='running')AU.c.resume();return}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=AU.c=new C();
 AU.mix=c.createGain();AU.mix.connect(c.destination);AU.m=c.createGain();AU.m.gain.value=AU.on.m?.45:0;AU.m.connect(AU.mix);AU.s=c.createGain();AU.s.gain.value=AU.on.s?.8:0;AU.s.connect(AU.mix);
 for(const n of[...SNDS,...MUSICS])fetch('assets/audio/'+n+'.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>new Promise((ok,ko)=>c.decodeAudioData(b,ok,ko))).then(b=>{AU.buf[n]=b;if(MUSICS.includes(n)&&AU.want===n)music(n,1)}).catch(()=>{});
 if(AU.want)music(AU.want,1)}
// iPhone : le son ne se débloque que sur un vrai toucher (touchend/click), et le mode silencieux coupe Web Audio sauf en session « playback »
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
function unlock(){auInit();if(!AU.c)return;try{const b=AU.c.createBuffer(1,1,22050),s=AU.c.createBufferSource();s.buffer=b;s.connect(AU.c.destination);s.start(0)}catch(e){}AU.c.resume&&AU.c.resume()}
['touchend','click','pointerup','keydown'].forEach(ev=>addEventListener(ev,unlock,{capture:true}));
document.addEventListener('visibilitychange',()=>{if(!AU.c)return;document.hidden?AU.c.suspend():AU.c.resume()});
function setSon(k){AU.on[k]=AU.on[k]?0:1;try{localStorage.setItem('landeSon',JSON.stringify(AU.on))}catch(e){}
 if(AU.c){const g=k==='m'?AU.m:AU.s;g.gain.setTargetAtTime(AU.on[k]?(k==='m'?.45:.8):0,AU.c.currentTime,.05)}sonBtns()}
function sonBtns(){document.querySelectorAll('.son-m').forEach(b=>b.style.opacity=AU.on.m?1:.35);document.querySelectorAll('.son-s').forEach(b=>b.style.opacity=AU.on.s?1:.35)}
function music(n,force){AU.want=n;const c=AU.c;if(!c||(AU.cur===n&&!force&&AU.src))return;
 if(AU.src){const o=AU.src;o.g.gain.setTargetAtTime(0,c.currentTime,.4);setTimeout(()=>{try{o.stop()}catch(e){}},2000);AU.src=null}
 AU.cur=n;const b=AU.buf[n];if(!b)return;const s=c.createBufferSource(),g=c.createGain();s.buffer=b;s.loop=true;s.g=g;g.gain.value=0;g.gain.setTargetAtTime(1,c.currentTime,.5);s.connect(g);g.connect(AU.m);s.start();AU.src=s}

function sfx(n,vol=1,rate=1){const c=AU.c;if(!c||!AU.on.s||!n)return;const b=AU.buf[n],g=c.createGain();g.gain.value=vol;g.connect(AU.s);
 if(b){const s=c.createBufferSource();s.buffer=b;s.playbackRate.value=rate*(.94+Math.random()*.12);s.connect(g);s.start();return}
 synth(n,g,c.currentTime)}
// sons de secours synthétisés (remplacés automatiquement par les mp3 ElevenLabs)
function synth(n,out,t){const c=AU.c;

// ---------- tours ----------
async function runFight(){
 while(phase==='fight'){
  turn=(turn+1)%order.length;const u=order[turn];if(u.dead)continue;cur=u;
  u.pa=u.maxPA;u.pm=u.maxPM;for(const k in u.cd)if(u.cd[k]>0)u.cd[k]--;if(u.shield>0)u.shield--;
  renderTL();render();
  if(u.poison){addFx(u.x,u.y,5,.9);hurt(u,u.poison.d,'poison');if(--u.poison.turns<=0)delete u.poison;await wait(600);if(end())return;if(u.dead)continue}
  if(u.team==='h'){sfx('turn',.5);reachC=reach(u,u.pm);render();await new Promise(r=>endTurnResolve=r);endTurnResolve=null}
  else{await wait(300);await ai(u)}
  if(u.buff&&--u.buff.turns<=0)delete u.buff;
  sel=null;if(end())return}
}
function end(){if(phase!=='fight')return true;const h=units.some(u=>u.team==='h'&&!u.dead),m=units.some(u=>u.team==='m'&&!u.dead);
 if(h&&m)return false;phase=h?'win':'lose';setTimeout(()=>result(h),900);if(endTurnResolve)endTurnResolve();return true}
async function ai(u){
 const sp=u.atk;
 for(let g=0;g<6&&!u.dead&&phase==='fight';g++){
  const heroes=units.filter(h=>h.team==='h'&&!h.dead);if(!heroes.length)return;
  if(u.pa>=sp.pa){const t=heroes.filter(h=>okTarget(u,sp,h)).sort((a,b)=>a.hp-b.hp)[0];if(t){await cast(u,sp,t);if(end())return;continue}}
  if(u.pm<=0)return;
  const rc=reach(u,u.pm);let best=null,bs=1e9;
  // champ de distance vers les héros (les autres monstres sont ignorés)
  const fd=new Map(),q=[];for(const h of heroes){fd.set(K(h.x,h.y),0);q.push(h)}
  while(q.length){const p=q.shift(),d=fd.get(K(p.x,p.y));for(const[dx,dy]of DIRS){const nx=p.x+dx,ny=p.y+dy,k=K(nx,ny);if(fd.has(k)||!passable(nx,ny))continue;fd.set(k,d+1);q.push({x:nx,y:ny})}}
  for(const[k,d]of rc.dist){const[x,y]=k.split(',').map(Number),from={x,y};
   const can=u.pa>=sp.pa&&heroes.some(h=>okTarget(u,sp,h,from));const s=can?d-(sp.r[1]>1?(fd.get(k)??0)*2:0):100+(fd.get(k)??99)*10+d;if(s<bs){bs=s;best=k}}
  if(!best||best===K(u.x,u.y))return;await moveTo(u,best,rc.prev);await wait(120);
 }
}

// ---------- interface ----------
function renderTL(){const tl=$('tl');tl.innerHTML='';const n=order.length;for(let i=0;i<n;i++){const u=order[((turn+i)%n+n)%n];if(u.dead)continue;
 const[s,idx]=u.team==='h'?[u.k,1]:[u.s,u.row*3];const c=icon(s,idx,34,u.team==='h'?.62:0);c.className=u.team+(u===cur?' cur':'');tl.appendChild(c)}}
function render(){
 const u=cur,P=$('panel');$('title').textContent=F?`${ZONES[F.zi].n} · ${F.boss?'Boss':F.i+1+'/3'}`:'';
 if(!u){return}
 const me=u.team==='h'&&phase==='fight';
 $('who').innerHTML='';const ic=icon(u.team==='h'?u.k:u.s,u.team==='h'?1:u.row*3,30,u.team==='h'?.62:0);$('who').append(ic,`${u.n}`);
 const hb=document.createElement('div');hb.id='hpb';hb.innerHTML=`<i style="width:${100*u.hp/u.max}%"></i>`;const ht=document.createElement('span');ht.id='hpt';ht.textContent=`${u.hp}/${u.max} PV`;$('who').append(hb,ht);
 $('pts').innerHTML=`<span class="pa">★ ${u.pa} PA</span><span class="pm">➤ ${u.pm} PM</span>`+(me?'':`<span style="color:#e08a7a">Tour ennemi…</span>`);
 const S=$('spells');S.innerHTML='';
 if(u.team==='h')for(const id of u.sp){const sp=SP[id],b=document.createElement('button');b.className='sp'+(sel&&sel.sp===sp?' sel':'');
  b.appendChild(icon('spells',sp.ic,58));b.insertAdjacentHTML('beforeend',`<b>${sp.pa}</b>`+(u.cd[sp.n]?`<em>${u.cd[sp.n]}</em>`:''));
  b.disabled=!me||busy||u.pa<sp.pa||u.cd[sp.n]>0;b.onclick=()=>{if(sel&&sel.sp===sp)sel=null;else sel={sp,cells:selCells(u,sp)};render()};S.appendChild(b)}
 $('end').disabled=!me||busy;
 $('hint').textContent=!me?`${u.n} joue.`:sel?`${sel.sp.n} — ${sel.sp.d}. ${sel.sp.dmg?sel.sp.dmg.join('–')+' dégâts · ':''}${sel.sp.heal?sel.sp.heal.join('–')+' soins · ':''}portée ${sel.sp.r.join('–')}. Touche une case orange.`:`Touche une case bleue pour bouger, ou choisis un sort.`;
}
function tapCell(px,py){
 const a=(px-ox)/(TW/2),b=(py-oy)/(TH/2),g={x:Math.round((a+b)/2),y:Math.round((b-a)/2)},k=K(g.x,g.y);
 if(sel?sel.cells.some(s=>s.ok&&s.x===g.x&&s.y===g.y):reachC&&reachC.dist.get(k)>0)return g;
 const now=units.filter(u=>!u.dead).sort((a,b)=>(b.gx+b.gy)-(a.gx+a.gy));
 for(const u of now){const[sx,sy]=scr(u.gx,u.gy),top=sy-u.h*TW-(u.fly?TH*.7:0);if(Math.abs(px-sx)<TW*.32&&py<sy+TH*.3&&py>top)return{x:u.x,y:u.y}}
 return g}
cv.addEventListener('pointerdown',async e=>{
 if(phase!=='fight'||busy)return;const c=tapCell(e.clientX,e.clientY),u=cur,o=occ(c.x,c.y);
 if(!u||u.team!=='h'){if(o)$('hint').textContent=info(o);return}
 if(sel){const hit=sel.cells.find(s=>s.x===c.x&&s.y===c.y&&s.ok);if(hit){const sp=sel.sp;sel=null;await cast(u,sp,c);if(end())return;reachC=reach(u,u.pm);render();autoEnd()}else{sel=null;render();if(o)$('hint').textContent=info(o)}return}
 const k=K(c.x,c.y);if(reachC&&reachC.dist.get(k)>0){await moveTo(u,k,reachC.prev);reachC=reach(u,u.pm);render();autoEnd();return}
 if(o)$('hint').textContent=info(o)});
function autoEnd(){const u=cur;if(!u||u.team!=='h'||!endTurnResolve||u.pm>0)return;
 if(u.sp.some(id=>{const sp=SP[id];return u.pa>=sp.pa&&!(u.cd[sp.n]>0)&&selCells(u,sp).some(c=>c.ok)}))return;
 $('hint').textContent='Plus rien à faire : tour suivant…';setTimeout(()=>{if(cur===u&&endTurnResolve&&!busy){sel=null;reachC=null;endTurnResolve()}},700)}
function info(o){return`${o.n} · ${o.hp}/${o.max} PV · ${o.maxPM} PM`+(o.atk?` · frappe ${o.atk.dmg.join('–')}`:'')}
$('end').onclick=()=>{if(endTurnResolve&&!busy){sel=null;reachC=null;endTurnResolve()}};
let fleeArm=0;$('flee').onclick=()=>{if(phase!=='fight')return;if(Date.now()-fleeArm<2500){phase='lose';if(endTurnResolve)endTurnResolve();result(false,true)}else{fleeArm=Date.now();$('flee').textContent='Sûr ?';setTimeout(()=>$('flee').textContent='Fuir',2500)}};

// ---------- écrans ----------
function startFight(zi,i){
 const Z=ZONES[zi];F={zi,i,lvl:Z.lvl+i,pool:Z.pool,boss:i===3?Z.boss:null,seed:zi*1000+i*97+save.gold,th:Z.th[i%Z.th.length]};
 document.body.classList.remove('camp');$('camp').classList.remove('on');$('result').classList.remove('on');$('map').classList.remove('on');
 const{hs,es}=genMap(F.seed,F.th);mkUnits(F,hs,es);rng=Math.random;fx=[];texts=[];turn=-1;cur=null;sel=null;phase='fight';
 layout();renderTL();render();music(F.boss?'boss':'battle');runFight();
}
function party(){const d=document.createElement('div');d.className='party';HER.forEach((h,i)=>{const s=heroStats(i),c=document.createElement('div');c.className='hc';
 const cv2=document.createElement('canvas');cv2.width=240;cv2.height=192;const g=cv2.getContext('2d'),f=AT[h.k][1],k=176/f[3];drawF(g,h.k,1,120,184,k);c.appendChild(cv2);
 c.insertAdjacentHTML('beforeend',`<b>${h.n}</b><small>${h.cls} · ${s.hp} PV${s.dmg?` · +${s.dmg} dég.`:''}${s.heal?` · +${s.heal} soin`:''}</small>`);
 const inv=document.createElement('div');inv.className='inv';save.items.filter(j=>ITEMS[j].who===i).forEach(j=>inv.appendChild(icon('items',ITEMS[j].ic,22)));c.appendChild(inv);d.appendChild(c)});return d}
function camp(){
 phase='camp';document.body.classList.add('camp');music('camp');const C=$('camp');C.innerHTML=`<h1>Tactika</h1><div class="sub">Prototype 1 · combats tactiques au tour par tour</div>`;
 C.appendChild(party());
 C.insertAdjacentHTML('beforeend',`<div style="font-weight:700">Niveau ${save.lvl} · ${save.xp}/${xpNeed(save.lvl)} XP</div><div class="bar"><i style="width:${100*save.xp/xpNeed(save.lvl)}%"></i></div>`);
 const st=document.createElement('div');st.className='stat';st.append(icon('items',15,22),` ${save.gold} or`,` · ${save.items.length}/${ITEMS.length} objets`);C.appendChild(st);
 const b=document.createElement('button');b.className='btn';b.style.cssText='font-size:18px;padding:14px 34px';b.textContent='Carte du monde';b.onclick=worldMap;C.appendChild(b);
 C.insertAdjacentHTML('beforeend',`<div class="how"><b>Comment jouer</b><br>Chaque héros a 6 <span class="pa">PA</span> (sorts) et 3 <span class="pm">PM</span> (cases).<br>• Touche une case <b style="color:#6ab0ff">bleue</b> pour te déplacer.<br>• Choisis un sort, puis une case <b style="color:#ffa040">orange</b>. Les cases grises sont hors de vue (un obstacle ou un personnage bloque).<br>• « Fin du tour » passe au suivant.<br>• Sur la carte, chaque zone a 3 combats puis un boss qui ouvre la zone suivante. Les combats gagnés se rejouent pour gagner de l'XP.</div>`);
 const r=document.createElement('button');r.className='btn dark';r.style.cssText='font-size:12px;padding:7px 12px';r.textContent='Recommencer à zéro';
 r.onclick=()=>{if(r.dataset.arm){save={fight:1,lvl:1,xp:0,gold:0,items:[],z:{}};store();camp()}else{r.dataset.arm=1;r.textContent='Touche encore pour effacer'}};C.appendChild(r);
 C.insertAdjacentHTML('beforeend',`<div style="display:flex;gap:8px;margin-top:12px"><button class="btn dark son-m" onclick="setSon('m')">♪ Musique</button><button class="btn dark son-s" onclick="setSon('s')">🔊 Sons</button></div><div class="sig">maxlolfr · GitHub</div>`);C.classList.add('on');sonBtns();
}
function worldMap(){
 phase='camp';document.body.classList.add('camp');music('camp');$('camp').classList.remove('on');const M=$('map');M.classList.add('on');
 const L=$('mapz');L.innerHTML='';
 const svg=`<svg class="road" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${ZONES.map(z=>z.x+','+z.y).join(' ')}" /></svg>`;L.insertAdjacentHTML('beforeend',svg);
 ZONES.forEach((z,zi)=>{const b=document.createElement('button'),ok=unlocked(zi),p=prog(z.id||'');b.className='zone'+(ok?'':' lock');b.style.left=z.x+'%';b.style.top=z.y+'%';
  const B=z.boss?MON[z.boss.k]:null;if(B)b.appendChild(icon(B.s,B.row*3,46));else b.insertAdjacentHTML('beforeend','<span class="q">?</span>');
  b.insertAdjacentHTML('beforeend',`<b>${z.n}</b><small>${z.soon?'Bientôt':!ok?'🔒 Bats le boss précédent':p>=4?'✓ Terminée':`${p}/4`}</small>`);
  b.onclick=()=>{if(ok)zoneSheet(zi)};L.appendChild(b)});
 $('zsheet').classList.remove('on');$('mapinfo').innerHTML=`Niv ${save.lvl} · ${save.gold} or`;
}
function zoneSheet(zi){const z=ZONES[zi],p=prog(z.id),S=$('zsheet');S.innerHTML=`<h3>${z.n}</h3><small>Niveaux ${z.lvl}–${z.lvl+3}</small>`;
 for(let i=0;i<4;i++){const b=document.createElement('button'),done=i<p,next=i===p;b.className='btn'+(next?'':' dark');b.disabled=i>p;
  b.textContent=(i===3?`Boss · ${z.boss.n}`:`Combat ${i+1}`)+` · niv ${z.lvl+i}`+(done?' ✓':'');b.onclick=()=>startFight(zi,i);S.appendChild(b)}
 const c=document.createElement('button');c.className='btn dark';c.textContent='Fermer';c.onclick=()=>S.classList.remove('on');S.appendChild(c);S.classList.add('on')}
function result(win,fled){
 const Rs=$('result');Rs.innerHTML='';cur=null;document.body.classList.add('camp');duck(4500);sfx(win?'victory':'defeat');
 if(win){const first=prog(ZONES[F.zi].id)===F.i,gold=Math.round((6*F.lvl+ri(0,8))*(first?1:.5))+(F.boss&&first?40:0),xp=killedXp;save.gold+=gold;save.xp+=xp;let up=0;while(save.xp>=xpNeed(save.lvl)){save.xp-=xpNeed(save.lvl);save.lvl++;up++}
  const free=ITEMS.map((_,i)=>i).filter(i=>!save.items.includes(i));let it=null;if(free.length&&Math.random()<(F.boss&&first?1:first?.5:.15)){it=pick(free);save.items.push(it)}
  if(first)save.z[ZONES[F.zi].id]=F.i+1;store();setTimeout(()=>sfx('coin'),900);if(up)setTimeout(()=>sfx('levelup'),1500);
  Rs.innerHTML=`<h1>Victoire !</h1><div class="sub">${ZONES[F.zi].n} · ${F.boss?F.boss.n+' vaincu !':'combat '+(F.i+1)+' gagné'}${F.boss&&first&&ZONES[F.zi+1]?'<br><b style="color:#ffd65a">Nouvelle zone : '+ZONES[F.zi+1].n+(ZONES[F.zi+1].soon?' (bientôt)':'')+'</b>':''}</div>`;
  const L=(ic,html)=>{const d=document.createElement('div');d.className='loot';d.append(ic);d.insertAdjacentHTML('beforeend',`<div>${html}</div>`);Rs.appendChild(d)};
  L(icon('spells',6,48),`<b>+${xp} XP</b>${up?`<br><span style="color:#ffd65a">Niveau ${save.lvl} ! PV et dégâts en hausse.</span>`:''}`);
  L(icon('items',15,48),`<b>+${gold} or</b>`);
  if(it!==null)L(icon('items',ITEMS[it].ic,48),`<b>${ITEMS[it].n}</b><br>${HER[ITEMS[it].who].n} : ${ITEMS[it].dmg?`+${ITEMS[it].dmg} dégâts`:ITEMS[it].hp?`+${ITEMS[it].hp} PV`:`+${ITEMS[it].heal} soin`}`);
 }else Rs.innerHTML=`<h1>${fled?'Retraite':'Défaite'}</h1><div class="sub">Tes héros se replient. Soigne-toi et réessaie, ou rejoue un combat déjà gagné pour monter de niveau.</div>`;
 const b=document.createElement('button');b.className='btn';b.style.marginTop='16px';b.textContent='Retour à la carte';b.onclick=()=>{Rs.classList.remove('on');worldMap()};Rs.appendChild(b);
 Rs.classList.add('on');
}

// ---------- démarrage ----------
document.addEventListener('click',e=>{if(e.target.closest('button'))sfx('click',.6)},true);
addEventListener('resize',()=>{if(phase!=='camp')layout()});
(async()=>{
 try{AT=await(await fetch('assets/atlas.json')).json();
  await Promise.all(Object.keys(AT).map(n=>new Promise((ok,ko)=>{const i=new Image();i.onload=()=>{IMG[n]=i;ok()};i.onerror=()=>ko(n);i.src='assets/'+n+'.webp'})));
 }catch(e){$('load').textContent='Impossible de charger les images ('+e+')';return}
 $('load').remove();camp();requestAnimationFrame(draw);
})();
</script>
