name: QA campaign
on:
  push:
    branches: [quality/chatgpt]
    paths: ['tools/qa-campaign.mjs', '.github/workflows/qa-campaign.yml']
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/qa-campaign.mjs | tee qa-campaign.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-campaign
          path: qa-campaign.txt
