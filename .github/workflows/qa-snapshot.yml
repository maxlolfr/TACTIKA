name: QA snapshot
on:
  push:
    branches: [quality/chatgpt]
    paths: ['.github/workflows/qa-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
      - uses: actions/checkout@v4
        with:
          ref: 05c584659d85fcd9f4453b2ac967cd7a79c4e72e
          path: snapshot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: snapshot
        run: |
          git rev-parse HEAD
          cp ../qa/tests/qa-roster.test.mjs tests/
          npm test
      - working-directory: snapshot
        run: |
          cp ../qa/tools/qa-browser.mjs tools/
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          export PW="$PWD/node_modules/playwright/index.mjs"
          export CHROME="$(node --input-type=module -e "import {chromium} from 'playwright'; console.log(chromium.executablePath())")"
          node tools/smoke.mjs qa-smoke
          node tools/qa-browser.mjs qa-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-browser
          path: |
            snapshot/qa-smoke
            snapshot/qa-browser
