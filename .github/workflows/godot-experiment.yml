name: Godot experimental Web build
on:
  push:
    branches: [experiment/godot]
    paths: ['godot/**', 'assets/**', '.github/workflows/godot-experiment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and export templates
        run: |
          VERSION=4.4.1
          BASE=https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable
          curl -fL --retry 3 "$BASE/Godot_v${VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v${VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
      - name: Reuse original assets
        run: cp -R assets godot/assets
      - name: Import and validate
        run: |
          godot --headless --path godot --editor --import 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error' /tmp/import.log
          godot --headless --path godot --quit-after 30 2>&1 | tee /tmp/smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/smoke.log
        shell: bash
      - name: Export Web
        run: |
          mkdir -p godot/build
          godot --headless --path godot --export-release Web build/index.html
          test -s godot/build/index.html
          test -s godot/build/index.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: tactika-godot-web
          path: godot/build/
          retention-days: 7
