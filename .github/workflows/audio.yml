name: Récupération des sons ElevenLabs
on:
  push:
    branches: [main]
    paths: [tools/audio-urls.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les sons
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          mkdir -p assets/audio/musique assets/audio/bruitages
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSfL "$url" -o "/tmp/$name.mp3"
            case "$name" in
              camp|battle|boss|main_theme|forest|elite_battle|cave|titan_boss|coast|mountain|castle|village|boss_v2|darkwood|map2|ember|boss_map2|victory|defeat) out="assets/audio/musique/$name.mp3"; cp "/tmp/$name.mp3" "$out" ;; # musiques : fichier d'origine, sans recompression
              *) out="assets/audio/bruitages/$name.mp3"; ffmpeg -nostdin -loglevel error -y -i "/tmp/$name.mp3" -ac 1 -b:a 64k "$out" ;;
            esac
            echo "$name $(du -h "$out" | cut -f1)"
          done < tools/audio-urls.txt
      - name: Enregistrer
        run: |
          git rm -q tools/audio-urls.txt
          git add assets/audio
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -m "Sons ElevenLabs ajoutés"
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
