name: Android (APK de test + AAB Google Play)
# Lancement manuel : onglet Actions -> « Android » -> Run workflow. Choisir demo=true pour l'APK de la démo.
# Sans secrets : un APK de test (debug) installable sur le téléphone. Avec les 4 secrets ANDROID_* : un AAB signé pour Google Play.
on:
  workflow_dispatch:
    inputs:
      demo:
        description: "Construire la démo (régions 1-2) au lieu du jeu complet"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Paquet web (jeu complet ou démo)
        run: |
          if [ "${{ inputs.demo }}" = "true" ]; then node packaging/build-web.mjs --demo packaging/www; else node packaging/build-web.mjs packaging/www; fi
      - name: Projet Android (Capacitor)
        working-directory: packaging
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: APK de test (debug)
        working-directory: packaging/android
        run: ./gradlew assembleDebug --no-daemon
      - name: AAB (release)
        working-directory: packaging/android
        run: ./gradlew bundleRelease --no-daemon
      - name: Signature de l'AAB (si les secrets existent)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          AAB=$(ls packaging/android/app/build/outputs/bundle/release/*.aab | head -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" "$AAB" "$KEY_ALIAS"
            echo "AAB signé : $AAB"
          else
            echo "Pas de secrets ANDROID_* : AAB non signé (inutilisable sur Google Play, utile pour vérifier la construction)."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tactika-android${{ inputs.demo && '-demo' || '' }}
          path: |
            packaging/android/app/build/outputs/apk/debug/*.apk
            packaging/android/app/build/outputs/bundle/release/*.aab
